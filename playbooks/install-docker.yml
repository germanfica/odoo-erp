# Uso:
# ansible-playbook install-docker.yml --ask-become-pass
- name: Instalar Docker Engine oficial en el host local
  hosts: "{{ TARGET_HOSTS | default('localhost') }}"
  connection: local
  become: "{{ USE_BECOME | default(true) }}"
  gather_facts: true

  vars:
    TARGET_HOSTS: "localhost"          # Nodo objetivo
    USE_BECOME: true                   # Elevar privilegios sudo
    DOCKER_USER: "{{ lookup('env', 'USER') }}"  # Usuario que inició Ansible

  pre_tasks:
    - name: Validar distribución compatible
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
        fail_msg: >-
          Este playbook sólo admite Ubuntu y Debian, que son las
          distribuciones cubiertas por el repositorio APT oficial de Docker.

  tasks:
    # - name: Remover paquetes Docker no oficiales o conflictivos
    #   ansible.builtin.apt:
    #     name:
    #       - docker.io
    #       - docker-compose
    #       - docker-compose-v2
    #       - docker-doc
    #       - podman-docker
    #       - containerd
    #       - runc
    #     state: absent
    #     purge: yes
    #   ignore_errors: yes

    - name: Limpiar repositorios Docker conflictivos
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        - /etc/apt/sources.list.d/docker.sources
        - /usr/share/keyrings/docker-archive-keyring.gpg
        - /etc/apt/keyrings/docker.asc

    - name: Actualizar caché de APT luego de limpiar repos conflictivos
      # ansible.builtin.apt:
      #   update_cache: yes
      # retries: 3
      # delay: 5
      # register: apt_cache_clean
      # failed_when: apt_cache_clean is failed
      block:
        - name: Actualizar caché de APT
          ansible.builtin.apt:
            update_cache: yes

      rescue:
        - name: Fallar indicando revisar APT manualmente
          ansible.builtin.fail:
            msg: >-
              No se pudo actualizar la caché de APT.
              Para más detalle, ejecutar en el servidor remoto:
              sudo apt update

    - name: Instalar dependencias para repo oficial de Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Crear directorio de keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar clave GPG oficial de Docker
      ansible.builtin.get_url:
        url: >-
          https://download.docker.com/linux/{{
            'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian'
          }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configurar repo oficial de Docker
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else ('arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else ansible_facts['architecture']) }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Actualizar caché de APT antes de instalar paquetes
      ansible.builtin.apt:
        update_cache: yes
      retries: 3
      delay: 5
      register: result
      until: result is succeeded

    - name: Instalar Docker Engine oficial y Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Crear wrapper de compatibilidad docker-compose -> docker compose
      ansible.builtin.copy:
        dest: /usr/local/bin/docker-compose
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          exec docker compose "$@"

    - name: Verificar compatibilidad docker-compose
      ansible.builtin.command:
        argv:
          - docker-compose
          - version
      register: docker_compose_compat
      changed_when: false

    - name: Asegurar que Docker esté iniciado y habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Agregar usuario a grupo docker
      ansible.builtin.user:
        name: "{{ DOCKER_USER }}"
        groups: docker
        append: yes
