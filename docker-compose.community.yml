# Variante local para una red Docker 'net' ya creada (p. ej. Nginx Proxy Manager).
services:
  odoo-db:
    image: postgres:16
    container_name: odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - net

  odoo:
    build: .
    image: odoo-community-argentina:18-local
    container_name: odoo
    restart: unless-stopped
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    networks:
      - net

networks:
  net:
    external: true
    name: net

volumes:
  odoo_db_data: {}
  odoo_web_data: {}
